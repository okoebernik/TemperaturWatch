## IDF Component Manager Manifest File
##
## esp_wifi_remote/esp_hosted stellen WLAN (Wifi 6, ueber den onboard
## ESP32-C6-Co-Prozessor per SDIO) fuer den ESP32-P4 bereit. Die App-seitige
## esp_wifi.h-API bleibt dabei unveraendert (transparenter RPC-Wrapper).
## Versions-Constraints wie im offiziellen Waveshare-Beispiel
## (waveshareteam/ESP32-P4-Platform, 10_wifistation/main/idf_component.yml).
dependencies:
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "0.14.*"

  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=2.12,<3.0"
      - if: "idf_version < 6.0"
        version: "1.4.*"

  espressif/mdns:
    version: "*"

  idf:
    version: ">=5.3.0"
